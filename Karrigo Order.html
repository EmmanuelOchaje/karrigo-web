document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

500;font-size:12.5px;color:{{ p.sfg }}\">{{ p.sub }}<\u002Fdiv><\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<aside style=\"flex:1 1 320px;min-width:0;position:sticky;top:96px;background:#fff;border-radius:30px;padding:24px\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\"><div style=\"font-weight:800;font-size:20px;letter-spacing:-.03em\">{{ cartKitchen }}<\u002Fdiv><button sc-camel-on-click=\"{{ backToKitchen }}\" style=\"padding:0;border:0;background:none;color:#4E6B00;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap\">Add more<\u002Fbutton><\u002Fdiv>\n<div style=\"margin-top:14px;display:flex;flex-direction:column;gap:12px\">\n<sc-for list=\"{{ lines }}\" as=\"l\" hint-placeholder-count=\"2\"><div style=\"display:flex;align-items:center;gap:10px;animation:kg-in .3s ease-out\"><div style=\"flex:1;min-width:0;font-weight:600;font-size:14px\">{{ l.name }}<div style=\"margin-top:2px;font-weight:700;font-size:13.5px;color:#6F7565\">{{ l.price }}<\u002Fdiv><\u002Fdiv><div style=\"flex:none;display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:#EFEEE8\"><button sc-camel-on-click=\"{{ l.dec }}\" aria-label=\"Remove one\" style=\"width:30px;height:30px;border:0;border-radius:50%;background:#fff;font-weight:700;font-size:16px;cursor:pointer\">−<\u002Fbutton><span style=\"min-width:22px;text-align:center;font-weight:800;font-size:14px\">{{ l.qty }}<\u002Fspan><button sc-camel-on-click=\"{{ l.inc }}\" aria-label=\"Add one\" style=\"width:30px;height:30px;border:0;border-radius:50%;background:#C6F432;font-weight:700;font-size:16px;cursor:pointer\">+<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:18px;padding-top:14px;border-top:1px solid #EFEEE8;display:flex;flex-direction:column;gap:8px;font-weight:600;font-size:14px;color:#6F7565\">\n<div style=\"display:flex;justify-content:space-between\"><span>Subtotal<\u002Fspan><span>{{ subtotal }}<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between\"><span>Delivery<\u002Fspan><span>{{ fee }}<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;margin-top:4px;font-weight:800;font-size:18px;color:#0E0F0D\"><span>Total<\u002Fspan><span>{{ total }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ coErr }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:14px 0 0;color:#C2410C;font-weight:600;font-size:13.5px;line-height:1.45;animation:kg-shake .35s ease-in-out\">{{ coErr }}<\u002Fp><\u002Fsc-if>\n<button sc-camel-on-click=\"{{ place }}\" style=\"margin-top:18px;width:100%;padding:17px;border:0;border-radius:999px;background:#0E0F0D;color:#C6F432;font-weight:700;font-size:15.5px;cursor:pointer;transition:transform .18s\" style-hover=\"transform:translateY(-2px)\" style-active=\"transform:scale(.98)\">{{ placeLabel }}<\u002Fbutton>\n<\u002Faside>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isTrack }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"Tracking\" style=\"padding:22px 18px 60px\">\n<div style=\"max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start\">\n<div style=\"flex:2 1 480px;min-width:0;position:relative;overflow:hidden;background:#0E0F0D;border-radius:40px;padding:clamp(24px,3.4vw,48px)\">\n<div style=\"position:absolute;top:-160px;right:-120px;width:440px;height:440px;border-radius:50%;border:1.5px solid rgba(198,244,50,.18);pointer-events:none\"><\u002Fdiv>\n<div style=\"position:relative\">\n<div style=\"font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,244,214,.5)\">Order {{ oId }} · {{ oKitchen }}<\u002Fdiv>\n<h1 style=\"margin:10px 0 0;font-weight:800;font-size:clamp(30px,4vw,52px);line-height:1;letter-spacing:-.045em;color:#FFF4D6\">{{ oTitle }}<\u002Fh1>\n<p style=\"margin:12px 0 0;font-weight:500;font-size:15.5px;color:rgba(255,244,214,.65)\">{{ oStatus }} · to {{ oTo }}<\u002Fp>\n<div style=\"margin-top:26px;height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden\"><div style=\"height:100%;width:{{ oProgress }};border-radius:999px;background:#C6F432;transition:width .8s cubic-bezier(.2,.8,.2,1)\"><\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:26px;display:flex;flex-direction:column;gap:16px\">\n<sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"5\"><div style=\"display:flex;align-items:center;gap:14px;font-weight:600;font-size:15px;color:{{ st.fg }};transition:color .4s\"><span style=\"flex:none;width:12px;height:12px;border-radius:50%;background:{{ st.dot }};transition:background .4s;animation:{{ st.anim }}\"><\u002Fspan>{{ st.label }}<\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ riderOn }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:28px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 14px 14px 16px;border-radius:26px;background:rgba(255,255,255,.07);animation:kg-in .3s ease-out\">\n<span style=\"flex:none;width:46px;height:46px;border-radius:50%;background:#C6F432;color:#12180A;display:grid;place-items:center;font-weight:800;font-size:15px\">DT<\u002Fspan>\n<div style=\"flex:1;min-width:120px\"><div style=\"font-weight:700;font-size:15.5px;color:#FFF4D6\">Doosuur Terhemba<\u002Fdiv><div style=\"margin-top:3px;font-weight:500;font-size:13px;color:rgba(255,244,214,.55)\">Your rider · ★ 4.9 · Red Bajaj<\u002Fdiv><\u002Fdiv>\n<button sc-camel-on-click=\"{{ callRider }}\" style=\"padding:12px 20px;border:0;border-radius:999px;background:#C6F432;color:#12180A;font-weight:700;font-size:14px;cursor:pointer\" style-active=\"transform:scale(.95)\">Call<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"margin-top:22px;display:flex;flex-wrap:wrap;gap:10px\">\n<sc-if value=\"{{ notDelivered }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ share }}\" style=\"padding:13px 22px;border:0;border-radius:999px;background:rgba(198,244,50,.14);color:#C6F432;font-weight:700;font-size:14px;cursor:pointer\">Share tracking link<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ delivered }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ orderAgain }}\" style=\"padding:13px 22px;border:0;border-radius:999px;background:#C6F432;color:#12180A;font-weight:700;font-size:14px;cursor:pointer\">Order something else<\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<aside style=\"flex:1 1 300px;min-width:0;background:#fff;border-radius:30px;padding:24px\">\n<div style=\"font-weight:800;font-size:20px;letter-spacing:-.03em\">Receipt<\u002Fdiv>\n<div style=\"margin-top:14px;display:flex;flex-direction:column;gap:10px\">\n<sc-for list=\"{{ oItems }}\" as=\"i\" hint-placeholder-count=\"2\"><div style=\"display:flex;gap:10px;font-weight:600;font-size:14px\"><span style=\"flex:none;color:#4E6B00\">{{ i.qty }}×<\u002Fspan><span style=\"flex:1;min-width:0\">{{ i.name }}<\u002Fspan><span style=\"flex:none\">{{ i.price }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:16px;padding-top:14px;border-top:1px solid #EFEEE8;display:flex;flex-direction:column;gap:8px;font-weight:600;font-size:14px;color:#6F7565\">\n<div style=\"display:flex;justify-content:space-between\"><span>Subtotal<\u002Fspan><span>{{ oSub }}<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between\"><span>Delivery<\u002Fspan><span>{{ oFee }}<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;margin-top:4px;font-weight:800;font-size:18px;color:#0E0F0D\"><span>Total<\u002Fspan><span>{{ oTotal }}<\u002Fspan><\u002Fdiv>\n<div style=\"margin-top:4px;font-size:13px\">{{ oPay }}<\u002Fdiv>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ goHome }}\" style=\"margin-top:18px;width:100%;padding:15px;border:0;border-radius:999px;background:#EFEEE8;color:#0E0F0D;font-weight:700;font-size:14.5px;cursor:pointer\" style-hover=\"background:#E4E3DB\">Back to kitchens<\u002Fbutton>\n<\u002Faside>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst NGN = n => '₦' + Number(n).toLocaleString('en-NG');\nconst KITCHENS = [\n  { id: 'terkimbi', name: \"Terkimbi's Kitchen\", cat: 'Swallow', sub: 'Swallow & soups · Wurukum', km: '0.8 km', eta: '20–30 min', free: true, img: (window.__resources && window.__resources.poundo) || 'https://m-kart-web.vercel.app/food/poundo.jpg',\n    menu: [['Pounded yam & egusi', 'With assorted meat', 2800], ['Amala & ewedu', 'Gbegiri and stew on the side', 2400], ['Semo & okra soup', 'With fresh fish', 2600], ['Goat meat pepper soup', 'Hot, one bowl', 3000], ['Zobo', 'Chilled, 50cl', 500]] },\n  { id: 'sewuese', name: 'Sewuese Rice Spot', cat: 'Rice', sub: 'Jollof & chicken · North Bank', km: '1.4 km', eta: '25–35 min', img: (window.__resources && window.__resources.jollof) || 'https://m-kart-web.vercel.app/food/jollof-chicken.jpg',\n    menu: [['Jollof rice & chicken', 'Party-style, with plantain', 2500], ['Fried rice & turkey', 'With coleslaw', 3200], ['Ofada rice & ayamase', 'Green pepper sauce', 2700], ['Extra plantain', 'Dodo, one portion', 600], ['Chapman', 'Chilled, 50cl', 800]] },\n  { id: 'grills', name: 'Benue Grills', cat: 'Grills', sub: 'Grills & barbecue · Judges Quarters', km: '2.6 km', eta: '35–45 min', img: (window.__resources && window.__resources.bbq) || 'https://m-kart-web.vercel.app/food/barbeque.jpg',\n    menu: [['Grilled chicken (half)', 'Peppered, with chips', 4500], ['Barbecue fish', 'Whole catfish, spicy sauce', 6000], ['Beef skewers', 'Four sticks', 2800], ['Roasted yam', 'With palm oil sauce', 1500], ['Chilled malt', '33cl can', 700]] },\n  { id: 'suya', name: 'Modern Market Suya', cat: 'Suya', sub: 'Suya & grills · Modern Market', km: '3.1 km', eta: '30–40 min', late: true, img: (window.__resources && window.__resources.meat) || 'https://m-kart-web.vercel.app/food/meat.jpg',\n    menu: [['Beef suya', 'Wrapped, with onions and yaji', 2000], ['Ram suya', 'Wrapped, extra yaji', 2500], ['Kilishi', '100g pack', 1800], ['Chicken suya', 'Half bird', 3500], ['Kunu', 'Chilled, 50cl', 500]] }\n];\nconst STAGES = [['Order accepted', 'The kitchen has your order'], ['Cooking', 'Your food is on the fire'], ['Picked up', 'Your rider has left the kitchen'], ['On the way', 'Your rider is heading to you'], ['Delivered', 'Enjoy your meal']];\nconst KEY = 'karrigo-web';\n\nclass Component extends DCLogic {\n  state = this.load();\n  load() {\n    let s = {};\n    try { s = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}\n    return { screen: 'home', authMode: 'login', authNote: '', kid: 'terkimbi', q: '', cat: 'All', form: { name: '', phone: '', password: '' }, err: '', coErr: '', pay: 'card', address: '', landmark: '', note: '', toast: '', pending: false, user: null, accounts: {}, cart: {}, ckid: null, order: null, ...s };\n  }\n  componentDidMount() {\n    this.onHash = () => {\n      const h = location.hash.slice(1);\n      if (h === 'login' || h === 'signup') this.go('auth', { authMode: h });\n      else if (h === 'kitchens') this.go('home');\n      else if (h.startsWith('kitchen-')) this.go('kitchen', { kid: h.slice(8) });\n      else if (h === 'track' && this.state.order) this.go('track');\n    };\n    this.onHash();\n    this.onScroll = () => { const sc = window.scrollY > 8; if (sc !== this.state.scrolled) this.setState({ scrolled: sc }); };\n    this.onScroll();\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    window.addEventListener('hashchange', this.onHash);\n    this.tick = setInterval(() => {\n      const o = this.state.order;\n      if (o && o.stage < 4) this.setState({ order: { ...o, stage: o.stage + 1 } });\n    }, 6000);\n  }\n  componentWillUnmount() { window.removeEventListener('hashchange', this.onHash); window.removeEventListener('scroll', this.onScroll); clearInterval(this.tick); clearTimeout(this.tt); }\n  componentDidUpdate() {\n    const { user, accounts, cart, ckid, order, address, landmark } = this.state;\n    try { localStorage.setItem(KEY, JSON.stringify({ user, accounts, cart, ckid, order, address, landmark })); } catch (e) {}\n  }\n  go(screen, extra = {}) {\n    const next = { screen, err: '', coErr: '', ...extra };\n    const RANK = { home: 0, kitchen: 1, checkout: 2, auth: 3, track: 4 };\n    if (screen === this.state.screen || !document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) { this.setState(next); window.scrollTo(0, 0); return; }\n    document.documentElement.dataset.kgDir = (RANK[screen] ?? 0) >= (RANK[this.state.screen] ?? 0) ? 'fwd' : 'back';\n    document.startViewTransition(() => new Promise(res => this.setState(next, () => { window.scrollTo(0, 0); res(); })));\n  }\n  say(toast) { clearTimeout(this.tt); this.setState({ toast }); this.tt = setTimeout(() => this.setState({ toast: '' }), 2600); }\n  kitchen(id) { return KITCHENS.find(k => k.id === id) || KITCHENS[0]; }\n  add(kid, i) {\n    let { cart, ckid } = this.state;\n    const k = `${kid}:${i}`;\n    if (ckid && ckid !== kid && Object.keys(cart).length) { cart = {}; this.say(`New cart started at ${this.kitchen(kid).name}`); }\n    this.setState({ cart: { ...cart, [k]: (cart[k] || 0) + 1 }, ckid: kid });\n  }\n  dec(k) {\n    const cart = { ...this.state.cart };\n    cart[k] = (cart[k] || 0) - 1;\n    if (cart[k] <= 0) delete cart[k];\n    this.setState({ cart, ckid: Object.keys(cart).length ? this.state.ckid : null });\n  }\n  setF(f) { return e => this.setState({ form: { ...this.state.form, [f]: e.target.value }, err: '' }); }\n  submit = e => {\n    e && e.preventDefault();\n    const { form, authMode, accounts, pending } = this.state;\n    const phone = form.phone.replace(/\\D/g, '');\n    const fail = err => this.setState({ err });\n    if (authMode === 'signup' && form.name.trim().length < 2) return fail('Enter your name.');\n    if (!/^0\\d{10}$/.test(phone)) return fail('Enter an 11-digit phone number, like 0803 123 4567.');\n    if (form.password.length < 6) return fail('Password needs at least 6 characters.');\n    let user, acc = accounts;\n    if (authMode === 'signup') {\n      if (accounts[phone]) return fail('That number already has an account. Log in instead.');\n      user = { name: form.name.trim(), phone };\n      acc = { ...accounts, [phone]: { name: user.name, pw: form.password } };\n    } else {\n      const a = accounts[phone];\n      if (!a) return fail('No account with that number. Sign up instead.');\n      if (a.pw !== form.password) return fail('Wrong password. Try again.');\n      user = { name: a.name, phone };\n    }\n    history.replaceState(null, '', location.pathname + location.search);\n    this.go(pending ? 'checkout' : 'home', { user, accounts: acc, pending: false, authNote: '', form: { name: '', phone: '', password: '' } });\n    this.say(authMode === 'signup' ? `Welcome to Karrigo, ${user.name.split(' ')[0]}` : `Welcome back, ${user.name.split(' ')[0]}`);\n  };\n  place = () => {\n    const { user, address, landmark, cart, ckid, pay, note } = this.state;\n    if (!user) return this.go('auth', { authMode: 'login', pending: true, authNote: 'Log in or sign up to place your order. Your cart is saved.' });\n    if (address.trim().length < 3 && landmark.trim().length < 3) return this.setState({ coErr: 'Add an address or a landmark so your rider can find you.' });\n    const k = this.kitchen(ckid);\n    const items = Object.entries(cart).map(([key, q]) => { const m = k.menu[key.split(':')[1]]; return { name: m[0], qty: q, price: m[2] * q }; });\n    const sub = items.reduce((s, i) => s + i.price, 0);\n    const fee = k.free ? 0 : 500;\n    const order = { id: 1000 + Math.floor(Math.random() * 9000), kitchen: k.name, items, sub, fee, total: sub + fee, pay, note, to: landmark || address, placed: Date.now(), stage: 0 };\n    this.go('track', {
